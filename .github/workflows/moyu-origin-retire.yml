name: Retire Moyu legacy Caddy origin (ESA cutover)

# Scoped one-time production hotfix. No workflow_dispatch: prod promotion alone
# triggers the operation. A retry is safe because the server script is idempotent.
on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/moyu-origin-retire.yml

permissions:
  contents: read

concurrency:
  group: moyu-domestic-production
  cancel-in-progress: false

jobs:
  retire:
    name: Disable only the Moyu legacy origin
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Fetch audited retirement script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/retire-moyu-origin.sh
          grep -Fq 'MOYU_ORIGIN_DISABLED=YES' scripts/retire-moyu-origin.sh

      - name: Transfer only the retirement script to the authorized host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: scripts/retire-moyu-origin.sh
          target: /tmp/moyu-origin-retire-${{ github.run_id }}
          overwrite: true

      - name: Back up Caddy, remove just the Moyu import, validate and reload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 5m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            script="/tmp/moyu-origin-retire-${{ github.run_id }}/scripts/retire-moyu-origin.sh"
            test -f "$script"
            bash "$script"
            rm -f -- "$script"
