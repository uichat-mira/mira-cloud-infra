name: DC Docker permission and short runtime verification

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/dc-docker-permission-once.yml

permissions:
  contents: read

jobs:
  grant-and-verify:
    name: Add Docker group and verify as DC user
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Set scoped OS group permission and start temporary DC test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 4m
          script: |
            set -eu
            test "$(id -u)" -eq 0 || { echo 'REQUIRES_ROOT_FOR_GROUP_CHANGE'; exit 1; }
            getent passwd mira-dc-poc >/dev/null
            getent group docker >/dev/null
            test -S /var/run/docker.sock
            test "$(stat -c %G /var/run/docker.sock)" = docker || { echo 'DOCKER_SOCKET_GROUP_MISMATCH'; exit 1; }
            test -x /opt/mira-dc-poc/v0.3.1/node
            test -r /opt/mira-dc-poc/v0.3.1/node_modules/@wonderwhy-er/desktop-commander/dist/index.js
            test -s /var/lib/mira-dc-poc/.desktop-commander-device/device.json || { echo 'DC_AUTH_SESSION_MISSING'; exit 1; }
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null
            test "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" -gt 450000 || { echo 'MEMORY_HEADROOM_TOO_LOW'; exit 1; }
            if systemctl is-active --quiet mira-dc-pairing-poc.service || systemctl is-active --quiet mira-dc-docker-verify.service; then
              echo 'DC_POC_ALREADY_RUNNING_ABORT'
              exit 1
            fi
            modified=0
            rollback_on_error() {
              code=$?
              trap - EXIT
              if [ "$code" -ne 0 ] && [ "$modified" -eq 1 ]; then
                gpasswd -d mira-dc-poc docker >/dev/null || true
                echo 'DOCKER_GROUP_ROLLBACK_ATTEMPTED'
              fi
              exit "$code"
            }
            trap rollback_on_error EXIT
            if id -nG mira-dc-poc | tr ' ' '\n' | grep -qx docker; then
              echo 'DOCKER_GROUP_ALREADY_PRESENT=YES'
            else
              usermod -aG docker mira-dc-poc
              modified=1
              echo 'DOCKER_GROUP_ADDED=YES'
            fi
            id -nG mira-dc-poc | tr ' ' '\n' | grep -qx docker
            echo 'DOCKER_GROUP_EFFECTIVE_IN_NSS=YES'
            runuser -u mira-dc-poc -- docker version --format 'CLIENT={{.Client.Version}} SERVER={{.Server.Version}}'
            container_count="$(runuser -u mira-dc-poc -- docker ps -q | wc -l)"
            echo "DOCKER_RUNNING_CONTAINERS_VISIBLE=$container_count"
            runuser -u mira-dc-poc -- docker ps -q >/dev/null
            echo 'DOCKER_ACCESS_VERIFIED_AS_DC_ACCOUNT=YES'
            systemd-run --quiet --unit=mira-dc-docker-verify --collect \
              -p User=mira-dc-poc \
              -p Group=mira-dc-poc \
              -p SupplementaryGroups=docker \
              -p WorkingDirectory=/var/lib/mira-dc-poc \
              -p Environment=HOME=/var/lib/mira-dc-poc \
              -p MemoryMax=402653184 \
              -p RuntimeMaxSec=1800 \
              -p Restart=no \
              /opt/mira-dc-poc/v0.3.1/node \
              /opt/mira-dc-poc/v0.3.1/node_modules/@wonderwhy-er/desktop-commander/dist/index.js remote
            systemctl is-active --quiet mira-dc-docker-verify.service
            test "$(id -nG mira-dc-poc | tr ' ' '\n' | grep -cx docker)" -eq 1
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null
            echo 'DC_TEMPORARY_SERVICE_STARTED=YES'
            echo 'DC_SYSTEMD_PERMANENT_SERVICE_CHANGED=NO'
            echo 'EXISTING_SERVICES_HEALTHY=YES'
            trap - EXIT
