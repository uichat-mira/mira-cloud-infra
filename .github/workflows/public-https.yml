name: Configure Caddy and IP HTTPS

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/public-https.yml
      - site/index.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-public-https
  cancel-in-progress: false

jobs:
  ingress:
    name: Pinned Caddy upgrade and public IP HTTPS
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MIRA_PUBLIC_DOMAIN: ${{ vars.MIRA_PUBLIC_DOMAIN }}
      MIRA_ALIAS_DOMAIN: ${{ vars.MIRA_ALIAS_DOMAIN }}
      MIRA_IP: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Check public hostname
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MIRA_PUBLIC_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]{3,250}[a-z0-9]$ ]]
          [[ "$MIRA_PUBLIC_DOMAIN" == *.* ]]
          [[ "$MIRA_ALIAS_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]{3,250}[a-z0-9]$ ]]
          [[ "$MIRA_ALIAS_DOMAIN" == *.* ]]
          [[ "$MIRA_ALIAS_DOMAIN" != "$MIRA_PUBLIC_DOMAIN" ]]
          [[ "$MIRA_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          echo "Ingress hostname configured; awaiting safe backend preflight"

      - name: Prepare isolated static homepage directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -eu
            install -d -m 0755 /var/www/mira-gateway/site

      - name: Upload one static homepage (no app code or secrets)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "site/index.html"
          target: "/var/www/mira-gateway"
          overwrite: true

      - name: Verify New API initial admin has been configured
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            curl --fail --silent --show-error --max-time 6 http://127.0.0.1:3000/api/status >/dev/null
            echo '[preflight] local New API responds'
            SETUP_STATE="$(curl --fail --silent --show-error --max-time 6 http://127.0.0.1:3000/api/setup | python3 -c 'import json,sys; d=json.load(sys.stdin); print("initialized" if d.get("data",{}).get("status") is True else "pending")')"
            if [ "$SETUP_STATE" != initialized ]; then
              echo 'INITIAL_ADMIN_PENDING: public HTTPS initial setup will be enabled temporarily; administrator must initialize promptly.'
            else
              echo 'INITIAL_ADMIN_READY'
            fi
            echo '[preflight] current listeners'
            ss -ltnH | grep -E ':(80|443|3000)[[:space:]]' || true

      - name: Install and configure minimal HTTPS ingress
        uses: appleboy/ssh-action@v1
        env:
          MIRA_PUBLIC_DOMAIN: ${{ env.MIRA_PUBLIC_DOMAIN }}
          MIRA_ALIAS_DOMAIN: ${{ env.MIRA_ALIAS_DOMAIN }}
          MIRA_IP: ${{ env.MIRA_IP }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: MIRA_PUBLIC_DOMAIN,MIRA_ALIAS_DOMAIN,MIRA_IP
          command_timeout: 12m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            . /etc/os-release
            test "$ID" = ubuntu
            test "$VERSION_CODENAME" = noble
            case "$MIRA_PUBLIC_DOMAIN" in
              ''|*[!a-z0-9.-]*)
                echo 'Invalid hostname' >&2; exit 1;;
            esac
            case "$MIRA_ALIAS_DOMAIN" in
              ''|*[!a-z0-9.-]*) echo 'Invalid alias hostname' >&2; exit 1;;
            esac
            echo '[caddy] Backup binary, package version, configuration'
            BACKUP_DIR="$(mktemp -d /opt/mira-cloud-infra/backups/caddy-upgrade.XXXXXXXX)"
            chmod 700 "$BACKUP_DIR"
            cp -p /usr/bin/caddy "$BACKUP_DIR/caddy.old"
            cp -p /etc/caddy/Caddyfile "$BACKUP_DIR/Caddyfile.old"
            dpkg-query -W caddy | awk '{print $2}' > "$BACKUP_DIR/version.old"
            echo 'BACKUP_READY'
            READY=no
            on_exit() {
              rc=$?
              trap - EXIT
              if [ "$READY" != yes ]; then
                echo 'UPGRADE_FAILED_RESTORING_OLD_CADDY'
                cp -p "$BACKUP_DIR/Caddyfile.old" /etc/caddy/Caddyfile
                if ! timeout 360 env DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-downgrades "caddy=$(cat "$BACKUP_DIR/version.old")"; then
                  cp -p "$BACKUP_DIR/caddy.old" /usr/bin/caddy
                fi
                systemctl restart caddy || true
              fi
              exit "$rc"
            }
            trap on_exit EXIT
            echo '[caddy] Add official stable apt source'
            timeout 180 apt-get update -qq
            timeout 240 env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gnupg
            curl -fsSL --retry 2 --max-time 40 https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --batch --yes --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
            curl -fsSL --retry 2 --max-time 40 https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list
            chmod 644 /usr/share/keyrings/caddy-stable-archive-keyring.gpg /etc/apt/sources.list.d/caddy-stable.list
            timeout 240 apt-get update -qq
            PIN="$(apt-cache madison caddy | awk '$3 ~ /^2[.]11[.]7([+~-]|$)/ {print $3; exit}')"
            test -n "$PIN"
            timeout 360 env DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confold "caddy=$PIN"
            caddy version | grep -Eq '^v?2[.]11[.]7([[:space:]]|$)'
            echo 'CADDY_2_11_7_INSTALLED'
            PRIVATE_IPV4="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1);exit}}')"
            python3 -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).is_private' "$PRIVATE_IPV4"
            python3 -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).is_global' "$MIRA_IP"
            cat > "$BACKUP_DIR/Caddyfile.new" <<EOF
            {
                default_sni $MIRA_IP
            }

            $MIRA_PUBLIC_DOMAIN, $MIRA_ALIAS_DOMAIN {
                bind $PRIVATE_IPV4
                encode gzip
                @restricted_public_posts {
                    method POST
                    path /api/user/register
                }
                respond @restricted_public_posts "Public registration disabled" 403
                reverse_proxy 127.0.0.1:3000
            }

            # MiraAI canonical community gateway: homepage plus the entire
            # authenticated New API application and protocol endpoints.
            # Keep the existing domain and IP sites intact as recovery paths.
            mira-ai.tomzlab.cn {
                bind $PRIVATE_IPV4
                encode gzip
                @gateway_registration {
                    method POST
                    path /api/user/register
                }
                @gateway_home {
                    method GET HEAD
                    path /
                }
                route {
                    respond @gateway_registration "Public registration disabled" 403
                    file_server @gateway_home {
                        root /var/www/mira-gateway/site
                    }
                    reverse_proxy 127.0.0.1:3000
                }
            }

            $MIRA_IP, https://$MIRA_IP:3000 {
                bind $PRIVATE_IPV4
                tls {
                    issuer acme {
                        profile shortlived
                    }
                }
                @landing {
                    method GET HEAD
                    path /
                    expression {port} == 3000
                }
                @on3000 expression {port} == 3000
                @health {
                    method GET
                    path /api/status
                }
                @restricted_registration {
                    method POST
                    path /api/user/register
                }
                route {
                    respond @restricted_registration "Public registration disabled" 403
                    file_server @landing {
                        root /var/www/mira-gateway/site
                    }
                    reverse_proxy @on3000 127.0.0.1:3000
                    reverse_proxy @health 127.0.0.1:3000
                    respond "Only HTTPS IP status checks are enabled." 403
                }
            }
            EOF
            test -s /var/www/mira-gateway/site/index.html
            chmod 0755 /var/www/mira-gateway /var/www/mira-gateway/site
            chmod 0644 /var/www/mira-gateway/site/index.html
            runuser -u caddy -- test -r /var/www/mira-gateway/site/index.html
            caddy fmt --overwrite "$BACKUP_DIR/Caddyfile.new"
            caddy validate --config "$BACKUP_DIR/Caddyfile.new" --adapter caddyfile
            cp -p "$BACKUP_DIR/Caddyfile.new" /etc/caddy/Caddyfile
            systemctl enable --now caddy
            systemctl reload caddy
            systemctl is-active --quiet caddy
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            curl -fsS --connect-timeout 3 --max-time 8 --resolve "$MIRA_IP:3000:$PRIVATE_IPV4" "https://$MIRA_IP:3000/api/status" >/dev/null
            READY=yes
            trap - EXIT
            echo 'CADDY_IP_HTTPS_CONFIG_APPLIED'
            echo '[ingress] Caddy installed, running, and allowed through active UFW'
            systemctl is-active caddy
            curl --fail --silent --show-error --connect-timeout 3 --max-time 8 --resolve "$MIRA_IP:3000:$PRIVATE_IPV4" "https://$MIRA_IP:3000/api/status" > /dev/null
            echo 'PRIVATE_NIC_PORT_3000_TRUSTED_HTTPS_HEALTHY'
            ss -ltnH | grep -E ':(80|443|3000)[[:space:]]' || true
            echo 'ORIGIN_INGRESS_CONFIGURED'

      - name: Verify public trust for the IP HTTPS certificate
        shell: bash
        env:
          MIRA_IP: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 12 "https://$MIRA_IP/api/status" || true)
            echo "attempt=$i ip_tls_status=$status"
            if [ "$status" = 200 ]; then
              echo 'TRUSTED_PUBLIC_IP_HTTPS_OK'
              exit 0
            fi
            sleep 10
          done
          echo 'TRUSTED_PUBLIC_IP_HTTPS_FAILED'
          exit 1

      - name: Verify public HTTPS port 3000 New API and registration protection
        shell: bash
        env:
          MIRA_IP: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          url="https://$MIRA_IP:3000"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 -o /dev/null "$url/api/status"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 15 "$url/")
          echo "NEW_API_HTTPS_3000_HOME_HTTP=$status"
          test "$status" = 200
          body=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$url/")
          echo "$body" | grep -Fq 'Mira AI Gateway'
          echo "$body" | grep -Fq 'Community Infrastructure'
          echo 'MIRA_STATIC_LANDING_BRAND_OK'
          locked=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 15 "https://$MIRA_IP/")
          echo "HEALTH_PORT_443_ROOT_HTTP=$locked"
          test "$locked" = 403
          reg=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 15 -X POST "$url/api/user/register")
          echo "NEW_API_HTTPS_3000_REGISTRATION_HTTP=$reg"
          test "$reg" = 403
          plain=$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 3 --max-time 6 "http://$MIRA_IP:3000/api/status" || true)
          echo "NEW_API_PLAINTEXT_3000_HTTP=$plain"
          test "$plain" != 200
          echo 'TRUSTED_IP_HTTPS_3000_FULL_NEW_API_OK'

      - name: Verify MiraAI domain full HTTPS gateway
        shell: bash
        run: |
          set -euo pipefail
          domain="mira-ai.tomzlab.cn"
          echo "Checking HTTPS for the full community gateway"
          dns_result=$(getent ahostsv4 "$domain" | awk '{print $1}' | sort -u || true)
          echo "DNS A answers: ${dns_result:-none}"
          for i in $(seq 1 18); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 12 "https://$domain/api/status" || true)
            echo "attempt=$i gateway_https_status=$status"
            if [ "$status" = 200 ]; then break; fi
            sleep 10
          done
          test "$status" = 200
          echo 'MIRAAI_DOMAIN_HTTPS_HEALTHY'
          homepage=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "https://$domain/")
          grep -Fq '让插入' <<< "$homepage"
          echo 'MIRAAI_DOMAIN_LANDING_OK'
          login_status=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$domain/sign-in")
          echo "MIRAAI_DOMAIN_LOGIN_HTTP=$login_status"
          test "$login_status" = 200
          api_status=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$domain/v1/models")
          echo "MIRAAI_DOMAIN_V1_UNAUTH_HTTP=$api_status"
          case "$api_status" in 401|403) ;; *) echo 'Expected model API to require authorization' >&2; exit 1;; esac
          blocked=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 -X POST "https://$domain/api/user/register")
          echo "MIRAAI_DOMAIN_REGISTER_HTTP=$blocked"
          test "$blocked" = 403
          echo 'MIRAAI_DOMAIN_FULL_GATEWAY_OK'

      - name: Report legacy alias status separately
        shell: bash
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 7 "https://$MIRA_ALIAS_DOMAIN/api/status" || true)
          echo "ALIAS_STATUS=$status"
