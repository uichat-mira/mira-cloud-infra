name: Configure Mira public HTTPS entry

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/public-https.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-public-https
  cancel-in-progress: false

jobs:
  ingress:
    name: Caddy HTTPS and external smoke
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MIRA_PUBLIC_DOMAIN: ${{ vars.MIRA_PUBLIC_DOMAIN }}
      MIRA_ALIAS_DOMAIN: ${{ vars.MIRA_ALIAS_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check public hostname
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MIRA_PUBLIC_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]{3,250}[a-z0-9]$ ]]
          [[ "$MIRA_PUBLIC_DOMAIN" == *.* ]]
          [[ "$MIRA_ALIAS_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]{3,250}[a-z0-9]$ ]]
          [[ "$MIRA_ALIAS_DOMAIN" == *.* ]]
          [[ "$MIRA_ALIAS_DOMAIN" != "$MIRA_PUBLIC_DOMAIN" ]]
          echo "Ingress hostname configured; awaiting safe backend preflight"

      - name: Verify New API initial admin has been configured
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            curl --fail --silent --show-error --max-time 6 http://127.0.0.1:3000/api/status >/dev/null
            echo '[preflight] local New API responds'
            SETUP_STATE="$(curl --fail --silent --show-error --max-time 6 http://127.0.0.1:3000/api/setup | python3 -c 'import json,sys; d=json.load(sys.stdin); print("initialized" if d.get("data",{}).get("status") is True else "pending")')"
            if [ "$SETUP_STATE" != initialized ]; then
              echo 'INITIAL_ADMIN_PENDING: public HTTPS initial setup will be enabled temporarily; administrator must initialize promptly.'
            else
              echo 'INITIAL_ADMIN_READY'
            fi
            echo '[preflight] current listeners'
            ss -ltnH | grep -E ':(80|443|3000)[[:space:]]' || true

      - name: Install and configure minimal HTTPS ingress
        uses: appleboy/ssh-action@v1
        env:
          MIRA_PUBLIC_DOMAIN: ${{ env.MIRA_PUBLIC_DOMAIN }}
          MIRA_ALIAS_DOMAIN: ${{ env.MIRA_ALIAS_DOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: MIRA_PUBLIC_DOMAIN,MIRA_ALIAS_DOMAIN
          command_timeout: 12m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            . /etc/os-release
            test "$ID" = ubuntu
            test "$VERSION_CODENAME" = noble
            case "$MIRA_PUBLIC_DOMAIN" in
              ''|*[!a-z0-9.-]*)
                echo 'Invalid hostname' >&2; exit 1;;
            esac
            case "$MIRA_ALIAS_DOMAIN" in
              ''|*[!a-z0-9.-]*) echo 'Invalid alias hostname' >&2; exit 1;;
            esac
            echo '[ingress] Install system Caddy reverse proxy'
            if ! command -v caddy >/dev/null 2>&1; then
              timeout 360 apt-get update -qq
              timeout 600 env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends caddy
            fi
            install -d -m 0755 /etc/caddy
            if [ -s /etc/caddy/Caddyfile ]; then
              cp -p /etc/caddy/Caddyfile "/etc/caddy/Caddyfile.before-mira.$(date -u +%Y%m%dT%H%M%SZ)"
            fi
            PRIVATE_IPV4="$(ip -4 route get 1.1.1.1 | sed -nE 's/.* src ([0-9.]+).*/\\1/p' | head -n 1)"
            test -n "$PRIVATE_IPV4"
            python3 -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).is_private' "$PRIVATE_IPV4"
            # Keep Docker's 127.0.0.1:3000 binding unchanged.
            # Listen only on the ECS network interface for the temporary IP/port probe.
            cat > /etc/caddy/Caddyfile <<EOF
            $MIRA_PUBLIC_DOMAIN, $MIRA_ALIAS_DOMAIN {
                encode gzip
                @restricted_public_posts {
                    method POST
                    path /api/user/register
                }
                respond @restricted_public_posts "Public registration disabled" 403
                reverse_proxy 127.0.0.1:3000
            }

            http://:3000 {
                bind $PRIVATE_IPV4
                @probe {
                    method GET
                    path /api/status
                }
                handle @probe {
                    reverse_proxy 127.0.0.1:3000
                }
                handle {
                    respond "IP connectivity test only. Login, setup and API tokens require HTTPS." 403
                }
            }
            EOF
            caddy fmt --overwrite /etc/caddy/Caddyfile
            if ! caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo '[ingress] Invalid Caddy config. Restore previous backup.' >&2
              cp -p "$(ls -t /etc/caddy/Caddyfile.before-mira.* | head -n 1)" /etc/caddy/Caddyfile
              exit 1
            fi
            systemctl enable --now caddy
            systemctl reload caddy
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow 80/tcp
              ufw allow 443/tcp
            fi
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow 3000/tcp
            fi
            echo '[ingress] Caddy installed, running, and allowed through active UFW'
            systemctl is-active caddy
            curl --fail --silent --show-error --max-time 5 "http://$PRIVATE_IPV4:3000/api/status" > /dev/null
            echo 'PRIVATE_IP_3000_HEALTHY'
            ss -ltnH | grep -E ':(80|443|3000)[[:space:]]' || true
            echo 'ORIGIN_INGRESS_CONFIGURED'

      - name: Test IP port 3000 from outside ECS
        shell: bash
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 8 "http://$DEPLOY_HOST:3000/api/status" || true)
          echo "PUBLIC_IP_3000_STATUS=$status"
          test "$status" = 200

      - name: External HTTPS check of new alias from GitHub
        shell: bash
        run: |
          set -euo pipefail
          echo '[ingress] Check public HTTPS on new domain'
          for i in $(seq 1 12); do
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 12 "https://$MIRA_ALIAS_DOMAIN/api/status" || true)
            echo "attempt=$i external_http=$status"
            if [ "$status" = "200" ]; then
              echo 'PUBLIC_HTTPS_SMOKE_OK'
              exit 0
            fi
            sleep 5
          done
          echo '[ingress] Alias external HTTPS not yet healthy: check Alibaba Cloud ESA proxy state; prefer DNS-only during origin HTTPS setup, and verify Alibaba Cloud ICP access authorization.' >&2
          exit 1
