name: Legacy public IP HTTPS bootstrap (retired)

# This bootstrap re-created public IP:3000 and legacy API aliases.
# It is deliberately inert after the canonical gateway cutover.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse obsolete public-IP gateway provisioning
        run: |
          echo 'Legacy IP and alias gateway provisioning is retired.'
          exit 1
