name: First-time Mira cloud bootstrap

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/bootstrap-node.yml

permissions:
  contents: read

concurrency:
  group: mira-cloud-infra-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate pinned service and port
        run: bash scripts/check.sh

      - name: Prepare host (Docker, Compose, 1 GiB swap)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 18m
          script: |
            set -eu
            echo '[bootstrap] preflight'
            test "$(id -u)" -eq 0
            . /etc/os-release
            test "$ID" = ubuntu
            test "$VERSION_CODENAME" = noble
            test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 8388608
            echo '[bootstrap] capacity OK, existing services untouched'
            if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
              echo '[bootstrap] installing Ubuntu-maintained Docker Engine and Compose v2'
              timeout 360 apt-get update -qq
              apt-cache policy docker.io | grep -q 'Candidate:'
              apt-cache policy docker-compose-v2 | grep -q 'Candidate:'
              if apt-cache policy docker.io docker-compose-v2 | grep -q 'Candidate: (none)'; then
                echo '[bootstrap] Docker/Compose not available from current Ubuntu repos' >&2
                exit 1
              fi
              timeout 900 env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends docker.io docker-compose-v2
            fi
            systemctl enable --now docker >/dev/null
            docker info >/dev/null
            docker --version
            docker compose version

            echo '[bootstrap] configure limited swap if currently absent'
            if [ "$(awk 'NR>1 {sum += $3} END {print sum + 0}' /proc/swaps)" -eq 0 ]; then
              if [ -e /swapfile ]; then
                echo '[bootstrap] /swapfile already exists but is inactive; refusing to overwrite' >&2
                exit 1
              fi
              test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 4194304
              dd if=/dev/zero of=/swapfile bs=1M count=1024 status=none
              chmod 600 /swapfile
              mkswap /swapfile >/dev/null
              swapon /swapfile
              if ! grep -Eq '^[^#]*[[:space:]]/swapfile[[:space:]]' /etc/fstab; then
                printf '/swapfile none swap sw 0 0\n' >> /etc/fstab
              fi
            fi
            cat /proc/swaps
            install -d -m 0700 /opt/mira-cloud-infra/data /opt/mira-cloud-infra/backups
            install -d -m 0755 /opt/mira-cloud-infra/scripts
            echo 'HOST_BOOTSTRAP_OK'

      - name: Package pinned New API image
        run: |
          set -euo pipefail
          docker pull calciumion/new-api:v1.0.0-rc.37
          docker save calciumion/new-api:v1.0.0-rc.37 | gzip -1 > new-api-image.tar.gz
          gzip -t new-api-image.tar.gz
          ls -lh new-api-image.tar.gz

      - name: Upload the single-container service
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "docker-compose.yml,scripts/deploy.sh,new-api-image.tar.gz"
          target: "/opt/mira-cloud-infra"
          overwrite: true

      - name: Deploy and verify localhost only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 8m
          script: |
            set -eu
            bash /opt/mira-cloud-infra/scripts/deploy.sh
            echo '=== service ==='
            docker compose -f /opt/mira-cloud-infra/docker-compose.yml ps
            echo '=== memory after deploy ==='
            free -h
            echo '=== disk after deploy ==='
            df -h /
            echo '=== swap after deploy ==='
            cat /proc/swaps
            echo '=== bound listener ==='
            ss -ltnH | grep ':3000' || true
            echo 'FIRST_DEPLOY_SMOKE_OK'
