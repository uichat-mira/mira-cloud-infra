name: Deploy Cloud Pi

on:
  push:
    branches: [prod]
    paths:
      - cloud-pi/version.txt
      - scripts/cloud-pi-deploy.sh
      - scripts/check-cloud-pi.sh
      - .github/workflows/cloud-pi-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-cloud-pi-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deliver Cloud Pi image and verify on Mira node
    if: github.ref == 'refs/heads/prod' && vars.MIRA_CLOUD_PI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release contract offline
        run: bash scripts/check-cloud-pi.sh

      - name: Download and verify pinned Linux/amd64 image on GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA="$(cat cloud-pi/version.txt)"
          TAG="cloud-pi-$(printf '%s' "$SHA" | cut -c1-12)"
          BASE="https://github.com/uichat-mira/cloud-pi/releases/download/$TAG"
          mkdir -p dist
          curl --proto '=https' --proto-redir '=https' -fLSs --retry 3 --max-time 600 "$BASE/mira-cloud-pi-linux-amd64.tar.gz" \
            -o dist/mira-cloud-pi-linux-amd64.tar.gz
          curl --proto '=https' --proto-redir '=https' -fLSs --retry 3 --max-time 60 "$BASE/mira-cloud-pi-linux-amd64.tar.gz.sha256" \
            -o dist/mira-cloud-pi-linux-amd64.tar.gz.sha256
          (cd dist && sha256sum -c mira-cloud-pi-linux-amd64.tar.gz.sha256)
          curl --proto '=https' --proto-redir '=https' -fLSs --retry 3 --max-time 60 \
            "https://raw.githubusercontent.com/uichat-mira/cloud-pi/$SHA/deploy/compose.yaml" \
            -o dist/compose.yaml
          printf '%s\n' "$SHA" > dist/version.txt
          export CLOUD_PI_IMAGE="mira-cloud-pi:$SHA"
          export CLOUD_PI_DATA_DIR=/opt/cloud-pi/data
          export CLOUD_PI_SECRETS_FILE=/opt/cloud-pi/secrets/agent.env
          docker compose -f dist/compose.yaml config --quiet

      - name: Transfer and activate pinned Cloud Pi image with trusted SSH host key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT" && test -n "$SSHPASS"
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Pinned deploy host key is required"; exit 1; }
          test "$DEPLOY_USER" = root || { echo "Authorized root deploy user required"; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/cloud-pi-known-hosts"
          chmod 600 "$RUNNER_TEMP/cloud-pi-known-hosts"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          common=(-o BatchMode=no
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/cloud-pi-known-hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o PreferredAuthentications=password
            -o NumberOfPasswordPrompts=1
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3)
          # The same pinned known_hosts applies to BOTH control commands and
          # the 123-MB transfer; no alternate SSH library can silently bypass it.
          sshpass -e ssh -p "$DEPLOY_PORT" "${common[@]}" "$remote" '
            set -eu
            test "$(id -u)" -eq 0
            test -s /opt/cloud-pi/secrets/agent.env || {
              echo "[cloud-pi] missing private runtime configuration"
              exit 1
            }
            install -d -m 0755 /opt/cloud-pi/dist /opt/cloud-pi/backups /opt/cloud-pi/scripts
            test -d /opt/cloud-pi/data || {
              echo "[cloud-pi] missing persistent state directory"
              exit 1
            }
            if test -f /opt/cloud-pi/dist/compose.yaml; then
              cp /opt/cloud-pi/dist/compose.yaml "/opt/cloud-pi/backups/compose-before-$(date -u +%Y%m%dT%H%M%SZ).yaml"
            fi
            if test -f /opt/cloud-pi/dist/version.txt; then
              cp /opt/cloud-pi/dist/version.txt "/opt/cloud-pi/backups/version-before-$(date -u +%Y%m%dT%H%M%SZ).txt"
            fi
          '
          sshpass -e scp -P "$DEPLOY_PORT" "${common[@]}" \
            dist/compose.yaml dist/version.txt \
            dist/mira-cloud-pi-linux-amd64.tar.gz \
            dist/mira-cloud-pi-linux-amd64.tar.gz.sha256 \
            "$remote:/opt/cloud-pi/dist/"
          sshpass -e scp -P "$DEPLOY_PORT" "${common[@]}" \
            scripts/cloud-pi-deploy.sh "$remote:/opt/cloud-pi/scripts/cloud-pi-deploy.sh"
          sshpass -e ssh -p "$DEPLOY_PORT" "${common[@]}" "$remote" '
            set -eu
            bash /opt/cloud-pi/scripts/cloud-pi-deploy.sh
          '
