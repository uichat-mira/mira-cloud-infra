name: Publish tomzlab.cn Folio static site

# Manual only. A pipeline update must not redeploy a stale site commit.
on:
  workflow_dispatch:
    inputs:
      site_sha:
        description: Exact reviewed tomzlab-web prod commit
        required: true
        type: string
      one_time_folio_exception:
        description: Allow only the expressly approved 2026-11-21 site/Folio SHA pair
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tomzlab-static-site-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build verified Folio site and atomically publish
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SITE_SHA: ${{ inputs.site_sha }}
      FOLIO_SHA: 7d06408aa25bde1b00409366cf302883af67592f
      FOLIO_ONE_TIME_EXCEPTION: ${{ inputs.one_time_folio_exception }}

    steps:
      - name: Checkout production release rules
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout exact website
        uses: actions/checkout@v4
        with:
          repository: uichat-mira/tomzlab-web
          ref: ${{ env.SITE_SHA }}
          fetch-depth: 0
          path: web

      - name: Checkout exact Folio package source
        uses: actions/checkout@v4
        with:
          repository: uichat-mira/folio
          ref: ${{ env.FOLIO_SHA }}
          fetch-depth: 0
          path: folio

      - name: Verify both source commits belong to reviewed prod branches
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SITE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FOLIO_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C web rev-parse HEAD)" = "$SITE_SHA"
          git -C web fetch --quiet origin prod
          git -C web merge-base --is-ancestor "$SITE_SHA" FETCH_HEAD
          test "$(git -C folio rev-parse HEAD)" = "$FOLIO_SHA"
          git -C folio fetch --quiet origin prod
          if git -C folio merge-base --is-ancestor "$FOLIO_SHA" FETCH_HEAD; then
            echo 'FOLIO_PROD_ANCESTRY=PASS'
          elif [[ "$FOLIO_ONE_TIME_EXCEPTION" == 'true'
                  && "$SITE_SHA" == '0e76fd587fd22ab5932e1167c3d0c8fdcff1f8ee'
                  && "$FOLIO_SHA" == '7d06408aa25bde1b00409366cf302883af67592f' ]]; then
            # Explicit maintainer approval, 2026-11-21. No other SHA pair is exempt.
            # All build, contract, artifact, Caddy, rollback and T5 checks remain mandatory.
            echo 'FOLIO_ONE_TIME_PIN_EXCEPTION=APPROVED_EXACT_PAIR'
          else
            echo 'FOLIO_RELEASE_ADMISSION_DENIED' >&2
            exit 1
          fi
          bash -n infra/scripts/deploy-tomzlab-site.sh
          echo "TOMZLAB_SOURCES_VERIFIED=$SITE_SHA"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the exact approved Folio package
        shell: bash
        working-directory: folio
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -w @uichat-mira/folio
          npm pack --ignore-scripts --workspace @uichat-mira/folio --pack-destination ../
          test -f ../uichat-mira-folio-0.1.1.tgz

      - name: Build and verify the complete public website
        shell: bash
        working-directory: web
        env:
          TOMZLAB_FEED_MODE: required
          TOMZLAB_SITE_BASE: /
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --ignore-scripts --no-save --package-lock=false ../uichat-mira-folio-0.1.1.tgz
          npm run test:contract
          npm run typecheck
          npm run build
          python3 scripts/check_site.py
          node scripts/check-built-site.mjs
          test -z "$(find _site -type l -print -quit)"
          test ! -e _site/.env
          for file in index.html notes/index.html engineering/index.html weekly/index.html projects/index.html about/index.html journal/index.html 404.html robots.txt sitemap.xml assets/icons/logo.svg; do
            test -f "_site/$file"
          done
          test -n "$(find _site/assets -type f -name 'index-*.js' -print -quit)"
          test -n "$(find _site/assets -type f -name 'index-*.css' -print -quit)"
          echo "TOMZLAB_FULL_SITE_VERIFIED=$SITE_SHA"

      - name: Archive only verified generated static output
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "tomzlab-site-${SITE_SHA}.tar.gz" -C web/_site .
          tar -tzf "tomzlab-site-${SITE_SHA}.tar.gz" >/dev/null
          cp infra/scripts/deploy-tomzlab-site.sh ./deploy-tomzlab-site.sh

      - name: Verify existing dedicated Caddy origin without writes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1
            systemctl is-active --quiet caddy
            test -L /srv/www/tomzlab.cn/current
            test -f /srv/www/tomzlab.cn/current/index.html
            grep -RFlq --include='Caddyfile' --include='*.caddy' 'tomzlab.cn' /etc/caddy
            grep -RFlq --include='Caddyfile' --include='*.caddy' '/srv/www/tomzlab.cn/current' /etc/caddy
            echo TOMZLAB_PREDEPLOY_ORIGIN=PASS

      - name: Transfer only the site archive and release script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: 'tomzlab-site-*.tar.gz,deploy-tomzlab-site.sh'
          target: '/tmp'
          overwrite: true

      - name: Atomic switch and verified real HTTPS smoke with rollback
        uses: appleboy/ssh-action@v1
        env:
          SITE_SHA: ${{ env.SITE_SHA }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: SITE_SHA
          command_timeout: 6m
          script: |
            set -eu
            test -f /tmp/deploy-tomzlab-site.sh
            bash /tmp/deploy-tomzlab-site.sh "$SITE_SHA"
            rm -f /tmp/deploy-tomzlab-site.sh

      - name: Independent HTTPS observation
        shell: bash
        run: |
          set -euo pipefail
          curl --proto =https --proto-redir =https -fsSL --connect-timeout 5 --max-time 20 "https://tomzlab.cn/engineering/?released=${SITE_SHA}" | grep -F '工程与产品' >/dev/null
          echo TOMZLAB_EXTERNAL_HTTP=PASS
