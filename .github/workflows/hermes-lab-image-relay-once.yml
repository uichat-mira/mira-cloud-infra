name: Relay official Hermes image to lab once

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/hermes-lab-image-relay-once.yml

permissions:
  contents: read

concurrency:
  group: mira-hermes-lab-image-relay
  cancel-in-progress: false

jobs:
  relay:
    name: Pull upstream image on runner and stage CLI only
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify staged host and existing service health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -eu
            test -s /opt/hermes-lab/compose.yaml
            test -d /opt/hermes-lab/data
            cd /opt/hermes-lab
            docker compose -f compose.yaml config --quiet
            docker network inspect mira-cloud-infra_default >/dev/null
            swap_kib="$(awk 'NR>1{n+=$3}END{print n+0}' /proc/swaps)"
            test "$swap_kib" -ge 2000000
            free_kib="$(df -Pk / | awk 'NR==2{print $4}')"
            test "$free_kib" -gt 10485760
            test -z "$(docker ps -a --filter name=^/mira-hermes-lab$ --format '{{.Names}}')"
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            curl -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null
            echo 'HERMES_IMAGE_RELAY_PREFLIGHT_OK'

      - name: Pull official image on runner and save archive
        shell: bash
        run: |
          set -euo pipefail
          docker pull nousresearch/hermes-agent:stable
          docker image inspect nousresearch/hermes-agent:stable --format 'IMAGE_ID={{.Id}}'
          docker save nousresearch/hermes-agent:stable | gzip -1 > hermes-agent-image.tar.gz
          gzip -t hermes-agent-image.tar.gz
          ls -lh hermes-agent-image.tar.gz

      - name: Transfer the official image archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 35m
          source: "hermes-agent-image.tar.gz"
          target: "/opt/hermes-lab"
          overwrite: true

      - name: Load image, verify CLI and preserve existing services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 8m
          script: |
            set -eu
            cd /opt/hermes-lab
            test -s hermes-agent-image.tar.gz
            gzip -t hermes-agent-image.tar.gz
            gzip -dc hermes-agent-image.tar.gz | docker load
            rm -f hermes-agent-image.tar.gz
            docker compose -f compose.yaml run --rm --no-deps hermes --version
            docker image inspect nousresearch/hermes-agent:stable --format '{{.Id}}' > /opt/hermes-lab/image-id.txt
            test -z "$(docker ps -a --filter name=^/mira-hermes-lab$ --format '{{.Names}}')"
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            curl -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null
            free -h
            swapon --show
            df -h /
            echo 'HERMES_IMAGE_STAGED_CLI_OK_GATEWAY_NOT_STARTED'
