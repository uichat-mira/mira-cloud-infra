name: One-time Hermes HTTPS placeholder (fail closed)

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/hermes-https-placeholder-once.yml

permissions:
  contents: read

concurrency:
  group: mira-hermes-https-ingress
  cancel-in-progress: false

jobs:
  ingress:
    name: Add isolated fail-closed HTTPS route
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      MIRA_PUBLIC_DOMAIN: ${{ vars.MIRA_PUBLIC_DOMAIN }}
      DEPLOY_HOST_IP: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Validate hostname derivation (no hardcoded domain)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MIRA_PUBLIC_DOMAIN" =~ ^[a-z0-9-]+([.][a-z0-9-]+)+$ ]]
          [[ "$DEPLOY_HOST_IP" =~ ^([0-9]{1,3}[.]){3}[0-9]{1,3}$ ]]
          suffix="${MIRA_PUBLIC_DOMAIN#*.}"
          [[ "$suffix" == *.* ]]
          echo "Deriving Hermes hostname from configured organization public domain suffix"

      - name: Preflight and add fail-closed Caddy route
        uses: appleboy/ssh-action@v1
        env:
          MIRA_PUBLIC_DOMAIN: ${{ env.MIRA_PUBLIC_DOMAIN }}
          DEPLOY_HOST_IP: ${{ env.DEPLOY_HOST_IP }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: MIRA_PUBLIC_DOMAIN,DEPLOY_HOST_IP
          command_timeout: 7m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            test "$(systemctl is-active caddy)" = active
            test -s /opt/hermes-lab/compose.yaml
            test -s /opt/hermes-lab/image-id.txt
            test ! -e /etc/caddy/mira-hermes.caddy
            test -s /etc/caddy/Caddyfile
            ! grep -Fq 'mira-hermes.caddy' /etc/caddy/Caddyfile

            suffix="${MIRA_PUBLIC_DOMAIN#*.}"
            domain="hermes.$suffix"
            case "$domain" in *[!a-z0-9.-]*|'') echo 'Invalid derived hostname'; exit 1;; esac
            python3 - "$domain" "$DEPLOY_HOST_IP" <<'PY'
            import ipaddress, socket, sys
            name, expected = sys.argv[1:]
            assert ipaddress.ip_address(expected).is_global
            records = {s[4][0] for s in socket.getaddrinfo(name, 443, family=socket.AF_INET)}
            assert expected in records, f'DNS A mismatch; expected server IP, got {len(records)} addresses'
            print('HERMES_DNS_POINTS_TO_DEPLOY_HOST')
            PY

            curl --noproxy '*' -fsS --max-time 4 http://127.0.0.1:3000/api/status >/dev/null
            curl --noproxy '*' -fsS --max-time 4 http://127.0.0.1:8788/ready >/dev/null
            addr="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1);exit}}')"
            python3 - "$addr" <<'PY'
            import ipaddress,sys
            assert ipaddress.ip_address(sys.argv[1]).is_private
            PY

            backup="$(mktemp -d /opt/mira-cloud-infra/backups/hermes-ingress.XXXXXXXX)"
            chmod 700 "$backup"
            cp -p /etc/caddy/Caddyfile "$backup/Caddyfile.before"
            echo 'CADDY_BACKUP_CREATED'
            ready=no
            restore() {
              result=$?
              trap - EXIT
              if [ "$ready" != yes ]; then
                cp -p "$backup/Caddyfile.before" /etc/caddy/Caddyfile
                rm -f /etc/caddy/mira-hermes.caddy
                caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null && systemctl reload caddy || true
                echo 'HERMES_INGRESS_RESTORED_AFTER_FAILURE'
              fi
              exit "$result"
            }
            trap restore EXIT
            printf '%s {\n    bind %s\n    respond "Hermes is being prepared. Access is not yet enabled." 503\n}\n' "$domain" "$addr" > /etc/caddy/mira-hermes.caddy
            chmod 644 /etc/caddy/mira-hermes.caddy
            printf '\n# Hermes isolated HTTPS placeholder, no upstream and no public dashboard.\nimport /etc/caddy/mira-hermes.caddy\n' >> /etc/caddy/Caddyfile
            caddy fmt --overwrite /etc/caddy/mira-hermes.caddy
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            systemctl reload caddy
            systemctl is-active --quiet caddy
            ready=yes
            trap - EXIT
            echo 'HERMES_FAIL_CLOSED_HTTPS_ROUTE_INSTALLED'
            curl --noproxy '*' -fsS --max-time 4 http://127.0.0.1:3000/api/status >/dev/null
            curl --noproxy '*' -fsS --max-time 4 http://127.0.0.1:8788/ready >/dev/null
            echo 'EXISTING_SERVICES_HEALTHY'
            # Server-local TLS acceptance is independent of public client reachability.
            for i in 1 2 3 4 5; do
              code="$(curl --noproxy '*' -ksS --connect-timeout 3 --max-time 8 -o /dev/null -w '%{http_code}' --resolve "$domain:443:$addr" "https://$domain/" || true)"
              if [ "$code" = 503 ]; then echo 'HERMES_LOCAL_HTTPS_FAIL_CLOSED_503_OK'; exit 0; fi
              sleep 3
            done
            echo 'HERMES_LOCAL_HTTPS_PENDING_OR_FAIL' >&2
            exit 1
