name: Retire isolated Hermes lab (one-time)
on:
  push:
    branches: [prod]
    paths: [.github/workflows/hermes-retire-once.yml]
permissions:
  contents: read
concurrency:
  group: hermes-retirement
  cancel-in-progress: false
jobs:
  retire:
    name: Verify ownership, remove Hermes, smoke neighbour services
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Remove only verified Hermes resources on Mira cloud node
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 7m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            echo 'HERMES_RETIRE_PREFLIGHT_BEGIN'
            lab=/opt/hermes-lab
            site=/etc/caddy/mira-hermes.caddy
            main=/etc/caddy/Caddyfile
            test -d "$lab" && test ! -L "$lab"
            test -f "$lab/compose.yaml"
            grep -Fxq 'name: hermes-lab' "$lab/compose.yaml"
            grep -Fq 'container_name: mira-hermes-lab' "$lab/compose.yaml"
            test -s "$site" && test ! -L "$site"
            test -s "$main" && test ! -L "$main"
            test "$(systemctl is-active caddy)" = active
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null
            python3 - <<'PY'
            from pathlib import Path
            import json, subprocess, re
            lab=Path('/opt/hermes-lab')
            compose=(lab/'compose.yaml').read_text()
            assert 'image: nousresearch/hermes-agent:stable' in compose
            assert './data:/opt/data' in compose
            main=Path('/etc/caddy/Caddyfile').read_text()
            site=Path('/etc/caddy/mira-hermes.caddy').read_text()
            assert len(re.findall(r'(?m)^\s*import\s+/etc/caddy/mira-hermes\.caddy\s*$', main))==1, 'Ambiguous Caddy import'
            assert len(re.findall(r'(?m)^\s*hermes\.tomzlab\.cn\s*\{', site))==1, 'Unexpected Hermes domain'
            assert site.count('reverse_proxy 127.0.0.1:9119')==1, 'Unexpected Hermes upstream'
            containers=json.loads(subprocess.check_output(['docker','inspect','mira-hermes-lab'],text=True))
            assert len(containers)==1
            c=containers[0]
            assert c['Name']=='/mira-hermes-lab'
            assert c['Config']['Image']=='nousresearch/hermes-agent:stable'
            assert c['Config']['Labels'].get('com.docker.compose.project')=='hermes-lab'
            mounts=c['Mounts']
            assert len(mounts)==1 and mounts[0]['Type']=='bind' and mounts[0]['Source']=='/opt/hermes-lab/data' and mounts[0]['Destination']=='/opt/data', 'Unexpected mount'
            others=subprocess.check_output(['docker','ps','-aq'],text=True).split()
            for cid in others:
                x=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
                assert x['Image']!=c['Image'] or x['Name']=='/mira-hermes-lab', 'Image shared by another container'
            print('HERMES_CONTAINER_CADDY_DATA_AND_IMAGE_OWNERSHIP_VERIFIED')
            PY
            echo 'HERMES_RETIRE_PREFLIGHT_OK'
            # Temporary Caddy rollback copy, never a persistence backup.
            old="$(mktemp /tmp/hermes-retire-caddy.XXXXXXXX)"
            cp -p "$main" "$old"
            caddy_done=no
            restore() {
              if [ "$caddy_done" != yes ]; then
                cp -p "$old" "$main"
                caddy validate --config "$main" --adapter caddyfile >/dev/null 2>&1 && systemctl reload caddy || true
                echo HERMES_CADDY_CHANGE_ROLLED_BACK
              fi
              rm -f "$old"
            }
            trap restore EXIT
            python3 - <<'PY'
            from pathlib import Path
            import re
            path=Path('/etc/caddy/Caddyfile')
            text=path.read_text()
            text,n=re.subn(r'(?m)^[ \t]*import[ \t]+/etc/caddy/mira-hermes\.caddy[ \t]*\r?\n','',text)
            assert n==1, 'Caddy import changed since preflight'
            text=re.sub(r'(?m)^[ \t]*# Hermes password-gated trial, independent of Cloud Auth\.[ \t]*\r?\n','',text)
            path.write_text(text)
            PY
            caddy validate --config "$main" --adapter caddyfile >/dev/null
            systemctl reload caddy
            test "$(systemctl is-active caddy)" = active
            caddy_done=yes
            rm -f "$old"
            trap - EXIT
            rm -f -- "$site"
            echo HERMES_CADDY_ROUTE_REMOVED
            docker rm -f mira-hermes-lab
            echo HERMES_CONTAINER_REMOVED
            # The Compose file uses a bind mount, but remove any project-labelled
            # orphan volumes if present; Docker refuses volumes in use elsewhere.
            docker volume ls -q --filter label=com.docker.compose.project=hermes-lab | while IFS= read -r vol; do
              test -n "$vol" && docker volume rm "$vol"
            done
            if docker image inspect nousresearch/hermes-agent:stable >/dev/null 2>&1; then
              docker image rm nousresearch/hermes-agent:stable
            fi
            rm -rf -- "$lab"
            if test -d /var/log/caddy && test ! -L /var/log/caddy; then
              find /var/log/caddy -maxdepth 1 -type f -name 'hermes-access.json*' -delete
            fi
            echo HERMES_DATA_CONFIG_IMAGE_AND_LOG_REMOVED
            test ! -e "$lab"
            test ! -e "$site"
            ! docker container inspect mira-hermes-lab >/dev/null 2>&1
            ! docker image inspect nousresearch/hermes-agent:stable >/dev/null 2>&1
            ! grep -Fq '/etc/caddy/mira-hermes.caddy' "$main"
            caddy validate --config "$main" --adapter caddyfile >/dev/null
            test "$(systemctl is-active caddy)" = active
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            echo NEWAPI_READY_AFTER_RETIRE=YES
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null
            echo CLOUD_AUTH_READY_AFTER_RETIRE=YES
            echo HERMES_RETIREMENT_VERIFIED
