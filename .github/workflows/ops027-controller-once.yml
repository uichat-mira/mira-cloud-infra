name: OPS027 once-only audited DC controller install
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [verify, install, exercise]
        default: verify
permissions:
  contents: read
concurrency:
  group: ops027-one-time-ali-controller
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed source
        run: |
          set -euo pipefail
          bash -n labs/dc-control/install-prod.sh
          python3 -m unittest discover -s labs/dc-control -p 'test_*.py' -q
          python3 -m py_compile labs/dc-control/{server,helper,remote_node,remote_agent}.py
          node --check labs/dc-control/app.js
          find labs/dc-control -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
      - name: Upload reviewed source to root-only release directory
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "labs/dc-control/*,manifest.sha256"
          target: /root/mira-dc-control-release
          overwrite: true
      - name: Read-only verify existing Aliyun to Tencent restricted SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 3m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            cd /root/mira-dc-control-release
            test -f manifest.sha256
            sha256sum -c manifest.sha256 >/dev/null
            chmod -R go-w /root/mira-dc-control-release
            test -r /etc/mira-dc-remote/id_ed25519
            test -r /etc/mira-dc-remote/known_hosts
            test -r /etc/mira-dc-remote/target.json
            PYTHONPATH=/root/mira-dc-control-release/labs/dc-control /usr/bin/python3 -c 'from remote_node import request; d=request("status",{}); print("ALI_TO_TENCENT_RESTRICTED_SSH=PASS"); print("TENCENT_DC_RUNNING="+str(d["running"])); print("TENCENT_LEGACY_RUNNING="+str(d["legacyRunning"])); print("TENCENT_DEFAULT_DURATION="+str(d["policy"]["durationMinutes"]))'
            echo "OPS027_REMOTE_PREFLIGHT=PASS"
      - name: Install reviewed Aliyun controller with built-in backup and smoke
        if: inputs.operation == 'install'
        uses: appleboy/ssh-action@v1
        env:
          MIRA_DC_CONTROL_OWNER_USERNAME: ${{ vars.MIRA_DC_CONTROL_OWNER_USERNAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 5m
          envs: MIRA_DC_CONTROL_OWNER_USERNAME
          script: |
            set -eu
            test "$(id -u)" -eq 0
            test -n "$MIRA_DC_CONTROL_OWNER_USERNAME"
            bash /root/mira-dc-control-release/labs/dc-control/install-prod.sh
            test "$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8792/dc/api/nodes/tencent/status)" = 401
            echo "OPS027_ALI_CONTROLLER_INSTALLED=YES"

      - name: Exercise Tencent bounded DC start and stop from installed controller
        if: inputs.operation == 'exercise'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 3m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            cd /opt/mira-dc-control
            /usr/bin/python3 - <<'PY'
            import time
            from remote_node import request
            before = request("status", {})
            if before["running"] or before["legacyRunning"]:
                raise SystemExit("TX_EXERCISE_REFUSED_EXISTING_RUNNING_DC")
            print("TX_EXERCISE_INITIAL_STOPPED=YES", flush=True)
            attempted = False
            try:
                attempted = True
                started = request("start", {})
                assert started["running"] is True, "TX_START_DID_NOT_REPORT_RUNNING"
                assert isinstance(started["remainingSeconds"], (int, float))
                assert 0 < started["remainingSeconds"] <= 1800, "TX_UNBOUNDED_RUNTIME"
                print("TX_REAL_START=PASS", flush=True)
                time.sleep(4)
                observed = request("status", {})
                assert observed["running"] is True, "TX_PROCESS_DID_NOT_STAY_RUNNING"
                assert 0 < observed["remainingSeconds"] < 1800, "TX_COUNTDOWN_INCORRECT"
                print("TX_REAL_STATUS_COUNTDOWN=PASS", flush=True)
            finally:
                if attempted:
                    stopped = request("stop", {})
                    if stopped["running"] or stopped["legacyRunning"]:
                        raise SystemExit("TX_REAL_STOP_FAILED")
                    print("TX_REAL_STOP=PASS", flush=True)
            PY
            echo "OPS027_TENCENT_REAL_START_STOP=PASS"
