name: Install DC control API (loopback only)

on:
  push:
    branches: [prod]
    paths:
      - labs/dc-control/**
      - .github/workflows/dc-control-install.yml

permissions:
  contents: read

concurrency:
  group: dc-control-install-production
  cancel-in-progress: false

jobs:
  install:
    name: Deploy fixed-action nonroot DC controller
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and syntax before SSH
        shell: bash
        run: |
          set -euo pipefail
          bash -n labs/dc-control/install-prod.sh
          python3 -m py_compile labs/dc-control/server.py labs/dc-control/helper.py
          python3 -m unittest discover -s labs/dc-control -p 'test_*.py' -v
          node --check labs/dc-control/app.js

      - name: Transfer fixed source bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: labs/dc-control/*
          target: /tmp/mira-dc-control-release
          overwrite: true

      - name: Install controller without public route or DC autostart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 4m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            bash /tmp/mira-dc-control-release/labs/dc-control/install-prod.sh
            echo 'DC_CONTROL_LOCAL_ONLY=YES'
