name: OPS-027 one-time pinned Tencent root preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-027-one-time-tencent
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Verify root login with independently pinned ED25519 host identity
        shell: bash
        env:
          TX_DEPLOY_HOST: ${{ secrets.TX_DEPLOY_HOST }}
          TX_DEPLOY_USER: ${{ secrets.TX_DEPLOY_USER }}
          SSHPASS: ${{ secrets.TX_DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TX_DEPLOY_HOST" && test "$TX_DEPLOY_USER" = root && test -n "$SSHPASS"
          command -v sshpass >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null)
          SCAN="$(mktemp)"
          KNOWN="$(mktemp)"
          trap 'rm -f "$SCAN" "$KNOWN"' EXIT
          ssh-keyscan -T 8 -t ed25519 "$TX_DEPLOY_HOST" 2>/dev/null > "$SCAN"
          test "$(wc -l < "$SCAN")" -eq 1 || { echo "TX_ED25519_HOSTKEY_MISSING_OR_AMBIGUOUS"; exit 1; }
          FP="$(ssh-keygen -E sha256 -lf "$SCAN" | awk '{print $2}')"
          test "$FP" = 'SHA256:dts8drN74WDQjcE4OsKJ5zozv1oTQ7aLOSeeXLI16HE' || { echo "TX_HOST_IDENTITY_MISMATCH"; exit 1; }
          install -m 600 "$SCAN" "$KNOWN"
          echo "TX_HOST_ED25519_PIN_VERIFIED=YES"
          sshpass -e ssh -F /dev/null -T -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" \
            -o GlobalKnownHostsFile=/dev/null -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            "$TX_DEPLOY_USER@$TX_DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -eu
          test "$(id -u)" = 0 || { echo "TX_ROOT_REQUIRED"; exit 1; }
          echo "TX_ROOT_AUTHENTICATED=YES"
          echo "TX_HOSTNAME=$(hostname)"
          if id miraops >/dev/null 2>&1; then echo "TX_MIRAOPS_USER=YES"; else echo "TX_MIRAOPS_USER=NO"; fi
          for f in \
            /home/miraops/.desktop-commander-device/device.json \
            /opt/mira-dc-remote/remote_agent.py \
            /opt/mira-dc-remote/node_modules/@wonderwhy-er/desktop-commander/dist/index.js; do
            if test -f "$f"; then echo "TX_FILE_PRESENT=$(basename "$f")"; else echo "TX_FILE_MISSING=$(basename "$f")"; fi
          done
          if test -r /opt/mira-dc-remote/remote_agent.py; then
            printf '%s' '{"action":"status","payload":{}}' |
              /usr/sbin/runuser -u miraops -- /usr/bin/python3 /opt/mira-dc-remote/remote_agent.py |
              /usr/bin/python3 -c 'import json,sys; r=json.load(sys.stdin); print("TX_AGENT_STATUS_OK="+str(r.get("ok") is True)); print("TX_AGENT_ERROR_CODE="+str(r.get("code","none"))); print("TX_AGENT_DC_RUNNING="+str(r.get("data",{}).get("running","unknown"))); print("TX_AGENT_LEGACY_RUNNING="+str(r.get("data",{}).get("legacyRunning","unknown")))'
          else
            echo "TX_AGENT_STATUS=NOT_INSTALLED"
          fi
          printf 'TX_LINGER='; (loginctl show-user miraops -p Linger --value 2>/dev/null || echo UNAVAILABLE)
          echo "TX_READ_ONLY_PREFLIGHT=COMPLETED"
          REMOTE
          echo "TX_STRICT_PINNED_SSH_ROOT_LOGIN=PASS"
