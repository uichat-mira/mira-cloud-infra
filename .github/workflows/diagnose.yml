name: Diagnose Mira cloud node

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only server diagnostics
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    steps:
      - name: Verify pinned host identity
        id: hostkey
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PINNED_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PINNED_HOSTS"
          umask 077
          printf '%s\n' "$PINNED_HOSTS" > "$RUNNER_TEMP/mira-known-hosts"
          ssh-keygen -F "$HOST" -f "$RUNNER_TEMP/mira-known-hosts" >/dev/null
          FINGERPRINT="$(ssh-keygen -lf "$RUNNER_TEMP/mira-known-hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test -n "$FINGERPRINT"
          printf 'fingerprint=%s\n' "$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Inspect server (no modifications)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          fingerprint: ${{ steps.hostkey.outputs.fingerprint }}
          command_timeout: 3m
          script: |
            set -eu
            printf 'USER='; id -un
            printf 'OS='; . /etc/os-release; echo "$PRETTY_NAME"
            printf 'KERNEL='; uname -sr
            echo '=== memory ==='; free -h
            echo '=== disk ==='; df -h /
            echo '=== swap ==='; cat /proc/swaps
            echo '=== Docker ==='
            if command -v docker >/dev/null 2>&1; then
              docker --version
              docker compose version || true
              docker ps --format '{{.Names}}\t{{.Status}}' || true
            else
              echo 'Docker not installed'
            fi
            echo '=== gateway local probe ==='
            if command -v curl >/dev/null 2>&1; then
              curl --silent --show-error --fail --max-time 3 http://127.0.0.1:3000/api/status || true
            fi
