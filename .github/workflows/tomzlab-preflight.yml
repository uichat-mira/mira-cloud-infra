name: Audit tomzlab.cn production origin (read-only)

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/tomzlab-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomzlab-origin-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Inspect existing origin without modifications
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 4m
          script: |
            set -eu
            echo 'TOMZLAB_AUDIT_START'
            echo "IS_ROOT=$([ "$(id -u)" -eq 0 ] && echo yes || echo no)"
            if command -v caddy >/dev/null 2>&1; then
              echo 'CADDY_PRESENT=yes'
              if caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1; then
                echo 'CADDY_CONFIG_VALID=yes'
              else
                echo 'CADDY_CONFIG_VALID=no'
              fi
              echo "CADDY_ACTIVE=$(systemctl is-active caddy || true)"
            else
              echo 'CADDY_PRESENT=no'
            fi
            if [ -d /etc/caddy ]; then
              if grep -RFlq --include='*.caddy' --include='Caddyfile' 'tomzlab.cn' /etc/caddy 2>/dev/null; then
                echo 'HOSTNAME_REFERENCED=yes'
              else
                echo 'HOSTNAME_REFERENCED=no'
              fi
              if grep -RFlq --include='*.caddy' --include='Caddyfile' '/srv/www/tomzlab.cn/current' /etc/caddy 2>/dev/null; then
                echo 'EXPECTED_WEBROOT_REFERENCED=yes'
              else
                echo 'EXPECTED_WEBROOT_REFERENCED=no'
              fi
            fi
            if [ -L /srv/www/tomzlab.cn/current ]; then
              echo 'CURRENT_KIND=symlink'
              if [ "$(realpath -m /srv/www/tomzlab.cn/current)" = /srv/www/tomzlab.cn/current ]; then
                echo 'CURRENT_LINK_UNRESOLVED=yes'
              fi
            elif [ -d /srv/www/tomzlab.cn/current ]; then
              echo 'CURRENT_KIND=directory'
            elif [ -e /srv/www/tomzlab.cn/current ]; then
              echo 'CURRENT_KIND=other'
            else
              echo 'CURRENT_KIND=absent'
            fi
            if [ -f /srv/www/tomzlab.cn/current/index.html ]; then
              echo 'CURRENT_INDEX_PRESENT=yes'
            else
              echo 'CURRENT_INDEX_PRESENT=no'
            fi
            if [ -e /srv/www/tomzlab.cn ]; then
              echo 'SITE_PARENT_PRESENT=yes'
            else
              echo 'SITE_PARENT_PRESENT=no'
            fi
            if command -v curl >/dev/null 2>&1; then
              for path in / /weekly.html; do
                result="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 4 --max-time 12 "https://tomzlab.cn$path" 2>/dev/null || true)"
                case "$path" in /) echo "CURRENT_PUBLIC_HOME_HTTP=${result:-000}";; *) echo "CURRENT_PUBLIC_WEEKLY_HTTP=${result:-000}";; esac
              done
            fi
            echo 'TOMZLAB_AUDIT_DONE'
