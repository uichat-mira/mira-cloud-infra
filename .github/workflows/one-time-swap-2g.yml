name: One-time host swap expansion to 2 GiB

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/one-time-swap-2g.yml

permissions:
  contents: read

concurrency:
  group: mira-cloud-infra-swap-expansion
  cancel-in-progress: false

jobs:
  extend-swap:
    name: Preflight, extend swap and verify
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Host preflight (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 1m
          script: |
            set -eu
            test "$(id -u)" -eq 0 || sudo -n true
            fs="$(findmnt -n -o FSTYPE /)"
            echo "ROOT_FSTYPE=$fs"
            case "$fs" in ext4|xfs) ;; *) echo "Unsupported root FS for fallocate swap"; exit 1 ;; esac
            df -h /
            free -h
            cat /proc/swaps
            available_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
            test "$available_kib" -gt 5242880 || { echo "Less than 5 GiB disk free"; exit 1; }
            swap_kib="$(awk 'NR>1 {n+=$3} END {print n+0}' /proc/swaps)"
            if [ "$swap_kib" -ge 2000000 ]; then
              echo 'Swap already >= 2 GiB; mutation will be skipped.'
            else
              test "$swap_kib" -ge 950000 && test "$swap_kib" -le 1200000 || { echo 'Unexpected baseline swap; abort'; exit 1; }
              test ! -e /swapfile2 && test ! -L /swapfile2 || { echo '/swapfile2 exists; abort'; exit 1; }
              ! grep -Eq '^[[:space:]]*/swapfile2[[:space:]]' /etc/fstab || { echo 'fstab already has swapfile2; abort'; exit 1; }
            fi
            curl -fsS --max-time 4 http://127.0.0.1:3000/api/status >/dev/null
            curl -fsS --max-time 4 http://127.0.0.1:8788/ready >/dev/null
            echo 'PREFLIGHT_OK'

      - name: Add a second 1 GiB swapfile without stopping existing swap
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 3m
          script: |
            set -eu
            if [ "$(id -u)" -eq 0 ]; then
              run() { "$@"; }
            else
              sudo -n true
              run() { sudo -n "$@"; }
            fi
            fs="$(findmnt -n -o FSTYPE /)"
            case "$fs" in ext4|xfs) ;; *) echo 'Unsupported root filesystem'; exit 1 ;; esac
            swap_kib="$(awk 'NR>1 {n+=$3} END {print n+0}' /proc/swaps)"
            if [ "$swap_kib" -ge 2000000 ]; then
              echo 'Swap is already at least 2 GiB; no change.'
            else
              test "$swap_kib" -ge 950000 && test "$swap_kib" -le 1200000
              test ! -e /swapfile2 && test ! -L /swapfile2
              ! grep -Eq '^[[:space:]]*/swapfile2[[:space:]]' /etc/fstab
              available_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
              test "$available_kib" -gt 5242880
              run fallocate -l 1G /swapfile2
              run chmod 600 /swapfile2
              run mkswap /swapfile2
              run swapon /swapfile2
              printf '/swapfile2 none swap sw 0 0\n' | run tee -a /etc/fstab >/dev/null
              echo 'SWAPFILE2_CREATED_AND_PERSISTED'
            fi
            echo '=== POST-CHANGE SWAP ==='
            free -h
            cat /proc/swaps
            swapon --show
            total_kib="$(awk 'NR>1 {n+=$3} END {print n+0}' /proc/swaps)"
            test "$total_kib" -ge 2000000 || { echo 'Swap total is still below 2 GiB'; exit 1; }
            grep -Eq '^[[:space:]]*/swapfile2[[:space:]]' /etc/fstab || { echo 'swapfile2 not persisted'; exit 1; }
            curl -fsS --max-time 4 http://127.0.0.1:3000/api/status >/dev/null
            curl -fsS --max-time 4 http://127.0.0.1:8788/ready >/dev/null
            echo 'SWAP_2G_AND_SERVICES_OK'
