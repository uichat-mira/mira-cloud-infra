name: Stage Hermes Lab on cloud node once

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/hermes-lab-stage-once.yml

permissions:
  contents: read

concurrency:
  group: mira-hermes-lab-install
  cancel-in-progress: false

jobs:
  stage:
    name: Preflight and stage Hermes image (no gateway start)
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read-only host preflight
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -eu
            test ! -e /opt/hermes-lab/compose.yaml || { echo 'LAB_ALREADY_STAGED; will not overwrite'; exit 1; }
            docker network inspect mira-cloud-infra_default >/dev/null
            total_swap_kib="$(awk 'NR>1 {n+=$3} END {print n+0}' /proc/swaps)"
            test "$total_swap_kib" -ge 2000000 || { echo 'SWAP_BELOW_2G'; exit 1; }
            free_kib="$(df -Pk / | awk 'NR==2{print $4}')"
            test "$free_kib" -gt 10485760 || { echo 'DISK_HEADROOM_BELOW_10G'; exit 1; }
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            curl -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null
            echo 'HERMES_PREFLIGHT_OK'

      - name: Create isolated lab data directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 1m
          script: |
            set -eu
            mkdir -p /opt/hermes-lab/data
            chmod 700 /opt/hermes-lab/data

      - name: Transfer only the lab Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "labs/hermes/compose.yaml"
          target: "/opt/hermes-lab"
          strip_components: 2
          overwrite: false

      - name: Pull official image, smoke CLI and verify existing services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 13m
          script: |
            set -eu
            cd /opt/hermes-lab
            test -s compose.yaml
            docker compose -f compose.yaml config --quiet
            docker compose -f compose.yaml pull
            docker compose -f compose.yaml run --rm --no-deps hermes --version
            docker image inspect nousresearch/hermes-agent:stable --format '{{index .RepoDigests 0}}'
            test -z "$(docker ps -a --filter name=^/mira-hermes-lab$ --format '{{.Names}}')" || { echo 'Unexpected standing Hermes container'; exit 1; }
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null
            curl -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null
            free -h
            swapon --show
            df -h /
            echo 'HERMES_IMAGE_STAGED_CLI_SMOKE_OK_NO_GATEWAY_STARTED'
