name: Hermes Caddy reload failure read-only diagnosis
on:
  push:
    branches: [prod]
    paths: [.github/workflows/hermes-caddy-diagnose-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Inspect local Caddy service failure without printing credentials
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 3m
          script: |
            set -eu
            echo '=== Caddy state ==='
            systemctl show caddy -p ActiveState -p SubState -p Result -p ExecMainStatus
            echo '=== sanitized recent Caddy errors ==='
            python3 - <<'PY'
            import json,subprocess,re
            p=subprocess.run(['journalctl','-u','caddy','--since','2026-10-27 08:10:00 UTC','--until','2026-10-27 08:30:00 UTC','--output=json','--no-pager'],capture_output=True,text=True,timeout=30)
            print('JOURNAL_EXIT='+str(p.returncode))
            for row in p.stdout.splitlines():
              try: r=json.loads(row)
              except ValueError: continue
              msg=str(r.get('MESSAGE',''))
              if not any(w in msg.lower() for w in ('fail','error','permission','denied','reload','bind','listen','log file','certificate')): continue
              msg=re.sub(r'(\d{1,3}\.){3}\d{1,3}','[IP]',msg)
              msg=re.sub(r'https?://[^\s\"]+','[URL]',msg)
              msg=re.sub(r'(?i)(token|password|authorization|cookie|secret)[=: ]+[^\s,;]+',r'\1=[REDACTED]',msg)
              print('CADDY_REASON='+msg[:350])
            PY
            echo '=== rolled-back route ==='
            if test -e /etc/caddy/mira-hermes.caddy; then echo 'HERMES_CADDY_ROUTE=STILL_PRESENT'; else echo 'HERMES_CADDY_ROUTE=ABSENT'; fi
            echo '=== current gateway ==='
            docker inspect -f 'HERMES_RUNNING={{.State.Running}} OOM={{.State.OOMKilled}}' mira-hermes-lab
            echo '=== existing services ==='
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:3000/api/status >/dev/null && echo 'NEWAPI_OK'
            curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:8788/ready >/dev/null && echo 'CLOUD_AUTH_OK'
